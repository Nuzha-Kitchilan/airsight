<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>AirSight — Marker AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .back-btn {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 999;
      background: rgba(14, 21, 18, 0.88);
      color: #eef2ef;
      border: 1px solid #26332d;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 14px;
      text-decoration: none;
    }

    .hint {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 999;
      background: rgba(14, 21, 18, 0.88);
      color: #c4cec8;
      border: 1px solid #26332d;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 12px;
      max-width: 190px;
      text-align: right;
    }

    .hud {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 999;

      background: linear-gradient(
        to top,
        rgba(10, 14, 12, 0.97),
        rgba(10, 14, 12, 0)
      );

      padding: 30px 16px 24px;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .hud-label {
      color: #93a69c;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .level-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .level-btn {
      border: 1px solid #33443b;
      background: #1a2420;
      color: #eef2ef;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .level-btn[data-level="1"].active {
      border-color: #4fd68c;
      box-shadow: 0 0 0 1px #4fd68c inset;
    }

    .level-btn[data-level="2"].active {
      border-color: #c9d64f;
      box-shadow: 0 0 0 1px #c9d64f inset;
    }

    .level-btn[data-level="3"].active {
      border-color: #d68c4f;
      box-shadow: 0 0 0 1px #d68c4f inset;
    }

    .level-btn[data-level="4"].active {
      border-color: #e2593a;
      box-shadow: 0 0 0 1px #e2593a inset;
    }
  </style>
</head>

<body>

  <a class="back-btn" href="index.html">← Back</a>

  <div class="hint" id="hint">
    Point your camera at a Hiro marker to reveal the tree.
  </div>


  <!-- AR SCENE -->
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; precision: medium; colorManagement: true;"
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix;"
  >

    <!-- IMPORTANT: keep this path on one line -->
    <a-assets timeout="15000">
      <a-asset-item
        id="tree-model"
        src="assets/models/giant_low_poly_tree.glb">
      </a-asset-item>
    </a-assets>


    <a-marker preset="hiro" id="tree-marker">

      <!--
        Wrapper controls orientation.

        -90 rotates the tree so that it is
        approximately parallel with the marker.
      -->
      <a-entity
        id="tree-orientation"
        position="0 0.03 0"
        rotation="-90 0 0"
      >

        <a-entity
          id="tree-rig"
          gltf-model="#tree-model"
          position="0 0 0"
          rotation="0 0 0"
          auto-tree="level: 1; targetHeight: 1.0;"
        >
        </a-entity>

      </a-entity>

    </a-marker>


    <a-entity camera></a-entity>

  </a-scene>


  <!-- CONTROLS -->
  <div class="hud">

    <div class="hud-label">
      Pollution Level
    </div>

    <div class="level-buttons">

      <button
        class="level-btn active"
        data-level="1">
        Good
      </button>

      <button
        class="level-btn"
        data-level="2">
        Moderate
      </button>

      <button
        class="level-btn"
        data-level="3">
        Unhealthy
      </button>

      <button
        class="level-btn"
        data-level="4">
        Hazardous
      </button>

    </div>

  </div>


  <script>

    AFRAME.registerComponent('auto-tree', {

      schema: {
        level: {
          type: 'number',
          default: 1
        },

        targetHeight: {
          type: 'number',
          default: 1.0
        }
      },


      init: function () {

        this.materials = [];
        this.baseScale = 1;
        this.modelReady = false;

        // Hide tree until correct scale is calculated
        this.el.object3D.visible = false;


        this.el.addEventListener('model-loaded', () => {

          console.log('✅ Tree GLB successfully loaded.');

          const model =
            this.el.getObject3D('mesh');


          if (!model) {

            console.error(
              '❌ Tree model loaded but no mesh could be found.'
            );

            return;
          }


          // Reset scale before measuring
          this.el.object3D.scale.set(
            1,
            1,
            1
          );


          // Find model dimensions
          const box =
            new THREE.Box3()
              .setFromObject(model);


          const size =
            new THREE.Vector3();


          box.getSize(size);


          console.log(
            'Tree raw dimensions:',
            {
              width: size.x,
              height: size.y,
              depth: size.z
            }
          );


          if (
            !Number.isFinite(size.y) ||
            size.y <= 0
          ) {

            console.error(
              '❌ Invalid tree height:',
              size.y
            );

            return;
          }


          // Automatically calculate scale
          this.baseScale =
            this.data.targetHeight /
            size.y;


          console.log(
            '✅ Calculated tree scale:',
            this.baseScale
          );


          // Clone materials
          model.traverse((node) => {

            if (
              !node.isMesh ||
              !node.material
            ) {
              return;
            }


            const oldMaterials =
              Array.isArray(node.material)
                ? node.material
                : [node.material];


            const newMaterials =
              oldMaterials.map(
                (material) => {

                  const clone =
                    material.clone();


                  if (clone.color) {

                    this.materials.push({

                      material: clone,

                      originalColor:
                        clone.color.clone()

                    });

                  }


                  return clone;
                }
              );


            node.material =
              Array.isArray(node.material)
                ? newMaterials
                : newMaterials[0];

          });


          console.log(
            `✅ Found ${this.materials.length} tintable materials.`
          );


          this.modelReady = true;


          this.applyLevel(
            this.data.level
          );


          this.el.object3D.visible = true;

        });


        // Helpful error
        this.el.addEventListener(
          'model-error',
          (event) => {

            console.error(
              '❌ THE TREE GLB FAILED TO LOAD.',
              event.detail
            );

          }
        );

      },



      update: function (oldData) {

        if (!this.modelReady) {
          return;
        }


        if (
          oldData.level !==
          this.data.level
        ) {

          this.applyLevel(
            this.data.level
          );

        }

      },



      applyLevel: function (level) {

        if (!this.modelReady) {
          return;
        }


        const LEVELS = {

          1: {
            color:
              new THREE.Color('#4fd68c'),

            mix: 0.03,

            scaleFactor: 1.0
          },


          2: {
            color:
              new THREE.Color('#c9d64f'),

            mix: 0.25,

            scaleFactor: 0.96
          },


          3: {
            color:
              new THREE.Color('#b8753d'),

            mix: 0.55,

            scaleFactor: 0.88
          },


          4: {
            color:
              new THREE.Color('#32231c'),

            mix: 0.82,

            scaleFactor: 0.75
          }

        };


        const target =
          LEVELS[level] ||
          LEVELS[1];


        // Change colour
        this.materials.forEach(
          ({
            material,
            originalColor
          }) => {

            material.color
              .copy(originalColor)
              .lerp(
                target.color,
                target.mix
              );


            material.needsUpdate =
              true;

          }
        );


        // Change scale without destroying base scale
        const finalScale =
          this.baseScale *
          target.scaleFactor;


        this.el.object3D.scale.set(
          finalScale,
          finalScale,
          finalScale
        );


        console.log(
          `Pollution level = ${level}`
        );


        console.log(
          `Final tree scale = ${finalScale}`
        );

      }

    });



    /* POLLUTION BUTTONS */

    const buttons =
      document.querySelectorAll(
        '.level-btn'
      );


    const tree =
      document.getElementById(
        'tree-rig'
      );


    buttons.forEach((button) => {

      button.addEventListener(
        'click',
        () => {


          buttons.forEach((b) => {

            b.classList.remove(
              'active'
            );

          });


          button.classList.add(
            'active'
          );


          const level =
            Number(
              button.dataset.level
            );


          tree.setAttribute(
            'auto-tree',
            'level',
            level
          );

        }
      );

    });



    /* MARKER STATUS */

    const marker =
      document.getElementById(
        'tree-marker'
      );


    const hint =
      document.getElementById(
        'hint'
      );


    marker.addEventListener(
      'markerFound',
      () => {

        console.log(
          '✅ Hiro marker detected!'
        );


        hint.textContent =
          'Marker detected — change the pollution level below.';

      }
    );


    marker.addEventListener(
      'markerLost',
      () => {

        console.log(
          'Hiro marker lost.'
        );


        hint.textContent =
          'Point your camera at a Hiro marker to reveal the tree.';

      }
    );

  </script>

</body>
</html>
